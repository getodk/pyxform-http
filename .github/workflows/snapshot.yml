
name: Snapshot

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [pyxform-updated]
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout pyxform-http
        uses: actions/checkout@v6

      - name: Checkout pyxform
        uses: actions/checkout@v6
        with:
          repository: xlsform/pyxform
          ref: ${{ github.event.client_payload.sha || 'master' }}
          path: pyxform
          persist-credentials: false

      - name: Get commit hashes
        id: versions
        run: |
          echo "http=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "pyxform=$(git -C pyxform rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "http_full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pyxform_full=$(git -C pyxform rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: snapshot
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=snapshot
          cache-to: type=gha,mode=max,scope=snapshot
          build-contexts: |
            pyxform=./pyxform
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:SNAPSHOT
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:SNAPSHOT-${{ steps.versions.outputs.http }}-${{ steps.versions.outputs.pyxform }}
          labels: |
            org.opencontainers.image.revision=${{ steps.versions.outputs.http_full }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.getodk.pyxform.revision=${{ steps.versions.outputs.pyxform_full }}
